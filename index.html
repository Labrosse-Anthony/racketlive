<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>RacketLive</title>
    <meta
      name="description"
      content="RacketLive : calendrier des tournois, classements ATP et WTA et fiches joueurs de tennis"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#001c59" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b1626" media="(prefers-color-scheme: dark)" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="RacketLive" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:title" content="RacketLive" />
    <meta
      property="og:description"
      content="Calendrier des tournois, classements ATP et WTA et fiches joueurs de tennis"
    />

    <script>
      try {
        var theme = localStorage.getItem('racketlive-theme')
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches
            ? 'dark'
            : 'light'
        }
        document.documentElement.dataset.theme = theme
      } catch (e) {
        // Stockage indisponible : on garde le thème par défaut
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
